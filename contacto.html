<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="card-container">
        <!-- Columna Izquierda: Formulario -->
        <div class="form-section">
            <h2>Contáctenos</h2>

            <form action="php/enviar.php" method="POST" id="contactForm">
                <div class="input-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Ingrese su nombre" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Ingrese un correo email valido" required>
                </div>

                <div class="input-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        Acepto los <a href="#">Terminos de servicio</a>
                    </label>
                </div>

                <button type="submit" class="submit-btn">ENVIAR</button>
            </form>
        </div>

        <!-- Columna Derecha: Información de Contacto -->
        <div class="info-section">
            <div class="info-block">
                <h3>LLÁMANOS</h3>
                <p>1 (234) 567-891</p>
                <p>1 (234) 987-654</p>
            </div>

            <div class="info-block">
                <h3>LOCALIZACIÓN</h3>
                <p>121 Rock Sreet, 21 Avenue,</p>
                <p>Nueva York, NY 92103-9000</p>
            </div>

            <div class="info-block">
                <h3>NUESTROS MEJORES SERVICIOS</h3>
                <p class="service-item">Traslados locales</p>
                <p class="service-item">Traslados al aeropuerto</p>
                <p class="service-item">Excursiones y recorridos</p>
            </div>
        </div>
    </div>
    <!-- 1. Librería SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- 2. Tu archivo de JavaScript con la lógica del botón -->
  <script src="js/app.js"></script>
  
</body>


</html>
